<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI小熊 · 体育心得分享</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
  :root {
    --cream:#FFF6E9; --card:#FFFDF8; --line:#F0E2CC;
    --brown:#8B5A2B; --brown-soft:#B98A5E; --muted:#A8A29E;
    --honey:#F5A623; --honey-dark:#D97706;
    --green:#2F9E63; --green-bg:#E8F7EE;
    --coral:#F25C5C; --amber-bg:#FFF1D6;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:linear-gradient(160deg,#FFF9EE 0%,#FFEFD2 55%,#FFE7BD 100%);
    min-height:100vh;
    color:#4A3A28; font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    padding:24px; max-width:1240px; margin:0 auto;
  }
  header { display:flex; align-items:center; gap:16px; padding:6px 4px 0; }
  header img { width:78px; height:78px; filter:drop-shadow(0 3px 6px rgba(139,90,43,.25)); }
  header h1 { font-size:26px; color:var(--brown); letter-spacing:1px; }
  header h1 .paw { font-size:22px; }
  .sub { color:var(--brown-soft); font-size:13px; margin-top:6px; }
  .error { background:#FDE2E2; color:#B91C1C; border:1px solid #F5B5B5; padding:12px 16px; border-radius:14px; margin:16px 0; }

  .layout { display:flex; gap:18px; align-items:flex-start; margin-top:20px; }
  aside { width:250px; flex:none; position:sticky; top:18px; }
  main { flex:1; min-width:0; }

  /* ---- 左侧栏：每日红黑 ---- */
  .hh-side-title { font-size:16px; color:var(--brown); margin-bottom:12px; }
  .hh-total {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    margin-bottom:12px; box-shadow:0 4px 14px rgba(169,113,61,.10);
    font-size:13px; font-weight:800; color:var(--brown);
  }
  .hh-total .r { color:var(--coral); } .hh-total .b { color:#3A3A3A; }
  .hh-day {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 13px;
    margin-bottom:10px; box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .hh-day:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(169,113,61,.16); }
  .hh-date { font-size:12.5px; font-weight:800; color:var(--brown); display:flex; justify-content:space-between; align-items:center; }
  .hh-date .cnt { font-size:11px; font-weight:700; }
  .hh-date .cnt .r { color:var(--coral); } .hh-date .cnt .b { color:#3A3A3A; }
  .hh-date { cursor:pointer; }
  .hh-arrow { font-size:10px; color:var(--muted); transition:transform .18s; }
  .hh-day.open .hh-arrow { transform:rotate(180deg); }
  .hh-day .hh-body { display:none; }
  .hh-day.open .hh-body { display:block; }
  .hh-dots { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .dot { width:11px; height:11px; border-radius:50%; box-shadow:inset 0 -2px 3px rgba(0,0,0,.18); flex:none; }
  .dot.red { background:var(--coral); }
  .dot.black { background:#3A3A3A; }
  .dot.half { background:var(--honey); }
  .dot.push { background:var(--muted); }
  .hh-match { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--brown-soft); margin-top:7px; line-height:1.5; }
  .hh-match .hh-mid { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hh-match .hh-score { font-weight:800; color:var(--brown); }
  .hh-pending { font-size:11.5px; color:var(--honey-dark); background:var(--amber-bg); border-radius:8px; padding:3px 9px; margin-top:8px; display:inline-block; }

  /* ---- 中间首页：方案方块 ---- */
  .plan-blocks { display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:12px; }
  .plan-block {
    background:#FFF8EC; border:1px solid var(--line); border-top:4px solid var(--honey);
    border-radius:14px; padding:14px; display:block; text-decoration:none; color:inherit;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .plan-block:hover { transform:translateY(-3px); box-shadow:0 8px 18px rgba(169,113,61,.16); }
  .plan-block .pb-head { font-size:12.5px; font-weight:700; color:var(--brown); }
  .plan-block .pb-pct { font-size:24px; font-weight:800; margin:2px 0 6px; }
  .plan-block .pb-text { font-size:12px; color:var(--brown-soft); line-height:1.65; }
  .plan-block .pb-more { font-size:11px; color:var(--honey-dark); margin-top:8px; font-weight:700; }
  .plan-note { font-size:12px; color:var(--honey-dark); background:var(--amber-bg); border-radius:10px; padding:8px 12px; margin-top:12px; line-height:1.65; }
  .plan-group-title { font-size:13.5px; font-weight:800; color:var(--brown); margin:16px 0 10px; display:flex; align-items:center; gap:8px; }
  .plan-group-title:first-of-type { margin-top:0; }
  .plan-group-title .pg-tag { font-size:10.5px; color:var(--muted); font-weight:400; }
  .plan-fold {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 18px;
    font-size:14px; font-weight:800; color:var(--brown); cursor:pointer; margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:background .18s ease;
  }
  .plan-fold:hover { background:#FFF3DE; }
  .plan-fold .pf-arrow { color:var(--honey); font-size:12px; }
  .analysis-link {
    display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
    font-size:13.5px; font-weight:800; color:var(--brown); text-decoration:none;
    box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .analysis-link:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(169,113,61,.16); color:var(--honey-dark); }
  .analysis-link .al-sub { font-size:11px; color:var(--muted); font-weight:400; }
  .poster-frame {
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(169,113,61,.22); margin-bottom:18px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .poster-frame:hover { transform:translateY(-3px); box-shadow:0 14px 32px rgba(169,113,61,.28); }
  .poster-frame img { width:100%; display:block; }
  .poster-overlay { position:absolute; top:14px; left:24px; }
  .poster-overlay h2 { font-size:46px; font-weight:900; color:#8B5A2B; letter-spacing:3px;
    text-shadow:0 2px 10px #FFF, 0 0 4px #FFF, 0 0 14px #FFF, 0 0 20px #FFF; }
  .poster-overlay p { font-size:20px; font-weight:800; color:#D97706; letter-spacing:6px; margin-top:2px;
    text-shadow:0 1px 8px #FFF, 0 0 4px #FFF, 0 0 10px #FFF; }
  .poster-badges { position:absolute; top:18px; right:20px; display:flex; gap:8px; }
  .poster-badges span { background:rgba(255,255,255,.88); border-radius:999px; padding:5px 12px;
    font-size:12px; font-weight:700; color:var(--brown); box-shadow:0 2px 6px rgba(139,90,43,.18); }
  /* ---- 实际投注票样 ---- */
  .bet-gallery { display:flex; gap:12px; flex-wrap:wrap; align-items:stretch; }
  .bet-thumb {
    display:block; width:150px; border-radius:12px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 4px 12px rgba(169,113,61,.12); background:var(--card);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .bet-thumb:hover { transform:translateY(-3px); box-shadow:0 10px 20px rgba(169,113,61,.20); }
  .bet-thumb img { width:100%; display:block; }
  .bet-thumb .bt-zoom { font-size:11px; color:var(--honey-dark); text-align:center; padding:5px 0; font-weight:700; }
  .bet-note { flex:1; min-width:220px; font-size:12.5px; color:var(--brown-soft); line-height:1.75; background:#FFF8EC; border-radius:12px; padding:10px 14px; }
  .modal-img { position:relative; max-width:92vw; max-height:88vh; border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  @media (max-width: 920px) {
    .poster-overlay h2 { font-size:26px; }
    .poster-overlay p { font-size:13px; letter-spacing:3px; }
    .poster-badges { display:none; }
  }

  /* ---- 方案详解弹窗（:target 纯CSS实现） ---- */
  .modal { display:none; position:fixed; inset:0; z-index:50; }
  .modal:target { display:flex; align-items:center; justify-content:center; }
  .modal-mask { position:absolute; inset:0; background:rgba(74,58,40,.45); }
  .modal-box {
    position:relative; background:var(--card); border-radius:18px; padding:24px;
    max-width:580px; width:92%; max-height:82vh; overflow:auto;
    box-shadow:0 20px 50px rgba(74,58,40,.35);
  }
  .modal-box h3 { font-size:16px; color:var(--brown); padding-right:30px; }
  .modal-box h3 .m-pct { color:var(--honey-dark); margin-left:6px; }
  .modal-box h3 .m-date { font-size:11.5px; color:var(--muted); font-weight:400; margin-left:8px; }
  .modal-close { position:absolute; top:12px; right:16px; font-size:24px; line-height:1; text-decoration:none; color:var(--muted); }
  .modal-close:hover { color:var(--coral); }
  .modal-text { white-space:pre-wrap; font-size:13px; line-height:1.85; color:var(--brown-soft); margin-top:12px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:16px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px;
    box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 22px rgba(169,113,61,.18); }
  .card .num { font-size:30px; font-weight:800; color:var(--honey); }
  .card .lbl { color:var(--brown-soft); font-size:13px; margin-top:5px; }

  .panel {
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px;
    margin-bottom:16px; box-shadow:0 4px 14px rgba(169,113,61,.10);
  }
  .panel h2 { font-size:15px; margin-bottom:12px; color:var(--brown); }
  .ps-row { display:flex; align-items:center; gap:10px; padding:7px 2px; border-bottom:1px dashed var(--line); font-size:13px; }
  .ps-row:last-child { border-bottom:none; }
  .ps-name { width:76px; flex:none; font-weight:700; color:var(--brown); }
  .ps-cnt { flex:1; color:var(--brown-soft); font-size:12.5px; }
  .ps-cnt .r { color:var(--coral); font-weight:700; }
  .ps-cnt .b { color:#3A3A3A; font-weight:700; }
  .ps-cnt .h { color:var(--honey-dark); font-weight:700; }
  .ps-cnt .p { color:var(--muted); }
  .ps-dots { display:flex; gap:4px; flex-wrap:wrap; }
  .ps-rate { width:64px; flex:none; text-align:right; font-weight:800; color:var(--honey-dark); }
  .ps-rate.na { color:var(--muted); font-weight:400; font-size:11.5px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px; border-bottom:1px dashed var(--line); text-align:left; }
  th { color:var(--brown-soft); font-weight:700; }
  tr:last-child td { border-bottom:none; }

  .sec-title { margin:20px 0 12px; font-size:16px; color:var(--brown); }
  main > .sec-title:first-child { margin-top:0; }
  .sec-title .sec-sub { font-size:12px; color:var(--muted); font-weight:400; margin-left:6px; }

  .day-card {
    background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:14px;
    overflow:hidden; box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .day-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(169,113,61,.16); }
  .day-head { padding:15px 18px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .day-head:hover { background:#FFF3DE; }
  .day-title { font-weight:800; color:var(--brown); }
  .day-meta { color:var(--brown-soft); font-size:12px; margin-top:4px; }
  .badge { font-size:12px; padding:4px 12px; border-radius:999px; border:1px solid; font-weight:700; }
  .badge.good { color:var(--green); background:var(--green-bg); border-color:#8FD8AC; }
  .badge.pending { color:var(--honey-dark); background:var(--amber-bg); border-color:#F5C96B; }
  .day-body { display:none; padding:2px 18px 18px; }
  .day-card.open .day-body { display:block; }
  .sp { font-variant-numeric: tabular-nums; color:var(--brown-soft); }
  .sp-hot { color:var(--honey-dark); font-weight:800; }
  .sp-hcp { display:inline-block; margin-right:4px; font-size:11px; color:var(--muted); }

  .hit { color:var(--green); font-weight:700; } .miss { color:var(--coral); font-weight:700; }
  .half { color:var(--honey-dark); font-weight:700; } .wait { color:var(--muted); }
  .stars { color:var(--honey); }
  .mini-tiers { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-top:12px; }
  .mini-tier-link { text-decoration:none; color:inherit; }
  .mini-tier { background:#FFF8EC; border-left:3px solid var(--honey); border-radius:8px; padding:7px 10px; font-size:12px; color:var(--brown-soft); line-height:1.6; height:100%; }
  .mini-tier-link:hover .mini-tier { background:#FFF1D6; }
  .mini-tier b { color:var(--brown); }
  .review { font-size:13px; color:var(--brown-soft); margin-top:12px; line-height:1.8; white-space:pre-wrap; background:#FFF8EC; border-radius:12px; padding:10px 14px; }
  .review b { color:var(--brown); }

  footer { color:var(--brown-soft); font-size:12px; text-align:center; margin:28px 0 6px; line-height:1.8; }
  svg text { fill:var(--brown-soft); font-size:11px; }

  /* ---- 会员门 ---- */
  #gateRoot:empty { display:none; }
  .gate-overlay { position:fixed; inset:0; z-index:60; overflow:auto; padding:24px;
    background:linear-gradient(160deg,#FFF9EE 0%,#FFEFD2 55%,#FFE7BD 100%);
    display:flex; }
  .gate-card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px 26px;
    width:100%; max-width:380px; text-align:center; box-shadow:0 12px 36px rgba(169,113,61,.22); margin:auto; }
  .gate-logo { width:64px; height:64px; }
  .gate-card h2 { font-size:19px; color:var(--brown); margin:10px 0 6px; }
  .gate-sub { font-size:12.5px; color:var(--brown-soft); line-height:1.7; margin-bottom:14px; }
  .gate-tabs { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .gate-tab { font-size:13.5px; font-weight:700; color:var(--muted); padding:5px 18px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:var(--card); font-family:inherit; }
  .gate-tab.active { color:var(--brown); background:var(--amber-bg); border-color:#F5C96B; }
  .gate-card input { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px;
    margin-bottom:10px; background:#FFFDF8; color:#4A3A28; font-family:inherit; }
  .gate-card input:focus { outline:none; border-color:var(--honey); }
  .gate-card form { margin:0; }
  .gate-btn { width:100%; border:none; border-radius:10px; padding:11px 0; font-size:15px; font-weight:800; cursor:pointer;
    background:var(--honey); color:#fff; font-family:inherit; }
  .gate-btn:hover { background:var(--honey-dark); }
  .gate-btn:disabled { opacity:.6; cursor:default; }
  .gate-msg { min-height:20px; font-size:12.5px; color:var(--coral); margin-bottom:8px; }
  .gate-tip { font-size:11.5px; color:var(--muted); margin-top:12px; }
  .adm-overlay { position:fixed; inset:0; z-index:60; overflow:auto; padding:24px; background:rgba(74,58,40,.45); display:flex; align-items:flex-start; justify-content:center; }
  .adm-card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 20px; max-width:520px; width:100%; margin:auto; position:relative; box-shadow:0 20px 50px rgba(74,58,40,.28); }
  .adm-card h2 { font-size:17px; color:var(--brown); margin:0 30px 4px 0; }
  .adm-sec { margin-top:14px; }
  .adm-sec-title { font-size:13.5px; font-weight:800; color:var(--brown); margin-bottom:6px; }
  .adm-row { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; font-size:12.5px; color:var(--brown-soft); }
  .adm-row .am { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .adm-btn { border:none; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; background:var(--honey); color:#fff; font-family:inherit; }
  .adm-btn.revoke { background:var(--coral); }
  .adm-btn:disabled { opacity:.6; cursor:default; }
  .adm-empty { font-size:12px; color:var(--muted); padding:4px 2px; }
  .adm-msg { min-height:18px; font-size:12px; color:var(--coral); margin-top:8px; }
  .adm-close { position:absolute; top:10px; right:14px; font-size:22px; line-height:1; cursor:pointer; color:var(--muted); background:none; border:none; font-family:inherit; }
  .adm-close:hover { color:var(--coral); }
  #userBar { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .ub-mail { font-size:11.5px; color:var(--muted); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ub-out { font-size:12px; font-weight:700; color:var(--honey-dark); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:var(--card); }
  .ub-out:hover { color:var(--coral); }

  @media (max-width: 920px) {
    .layout { flex-direction:column; }
    aside { width:100%; position:static; }
  }
</style>
</head>
<body>
<header>
  <img src="assets/logo.svg" alt="AI小熊">
  <div>
    <h1>AI小熊 · 体育心得分享 <span class="paw">🐾</span></h1>
    <p class="sub" id="dataInfo">小熊加载中…</p>
  </div>
  <div id="userBar"></div>
</header>
<div id="errorBanner" class="error" hidden></div>

<div class="layout">
  <aside id="hongheiSidebar"></aside>
  <main>
    <div class="poster-frame"><img src="assets/ai-poster.png" alt="AI小熊主题海报">
      <div class="poster-overlay"><h2>AI小熊</h2><p>体育心得分享</p></div>
      <div class="poster-badges"><span>⚽ 竞彩方案</span><span>📊 标准盘</span><span>🐻 每日红黑</span></div>
    </div>
    <h2 class="sec-title">📊 每日预测总览</h2>
    <div id="dailyList"></div>
    <div class="cards" id="statCards"></div>
    <div id="planBlocks"></div>

    <div class="panel" id="planStatsPanel">
      <h2>🎯 方案层命中<span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:8px">按方案类型累计 · 半红计0.5 · 走水不计</span></h2>
      <div id="planStatsBody"></div>
    </div>

    <div class="panel">
      <h2>📈 近14日方向命中率</h2>
      <svg id="trendChart" viewBox="0 0 720 220" width="100%"></svg>
    </div>

    <div class="panel">
      <h2>🏆 联赛分布（方向命中）</h2>
      <table id="leagueTable"></table>
    </div>
  </main>
</div>

<div id="planModals"></div>
<div id="gateRoot"></div>
<div id="admRoot"></div>

<footer>🐻 小熊提醒：仅供娱乐参考，不构成投资建议<br>五式足球预测法 V2.6 驱动 · 数据由 AI 小熊每日维护</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="stats.js"></script>
<script>
// ---- Supabase 配置（Task 4 部署时填入真实值；占位时全站显示"整理中"） ----
var SUPABASE_URL = 'https://gzpuxgkpblpbpdpfvpof.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_QVvDcCQFfcTvVpVFmeqEQA_N1xNjGZW';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- 会员门：dev 模式 → 本地数据直渲；占位配置 → 整理中；否则走登录四态（注册→📧邮箱确认→🍯审核→内容） ----
(function () {
  var gate = document.getElementById('gateRoot');
  var params = new URLSearchParams(location.search);

  function showGate(html) {
    gate.innerHTML = '<div class="gate-overlay"><div class="gate-card">' + html + '</div></div>';
  }
  function showGateError(t) {
    var banner = document.getElementById('errorBanner');
    banner.hidden = false;
    banner.textContent = '🐻 ' + t;
  }
  function gateLogo() { return '<img src="assets/logo.svg" alt="AI小熊" class="gate-logo">'; }

  // dev 模式：本地预览/测试钩子（?dev），数据文件不上线时此模式自动失效
  if (params.has('dev')) {
    var s = document.createElement('script');
    s.src = 'data/predictions.js';
    s.onload = function () {
      if (typeof PREDICTION_DAYS !== 'undefined') renderApp(PREDICTION_DAYS);
      else showGateError('dev 模式：数据文件格式有误');
    };
    s.onerror = function () { showGateError('dev 模式：本地 data/predictions.js 加载失败'); };
    document.body.appendChild(s);
    return;
  }

  if (!window.supabase || SUPABASE_URL.indexOf('https://YOUR_') === 0) {
    showGate(gateLogo() + '<h2>🐻 小熊搬家整理中</h2><p class="gate-sub">会员系统上线准备中，请稍后再来</p>');
    return;
  }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function renderPending(email) {
    showGate(gateLogo() + '<h2>🍯 等小熊开门</h2>' +
      '<p class="gate-sub">账号 <b>' + esc(email) + '</b> 已注册，站长审核中…<br>通过后刷新即可进入</p>' +
      '<button class="gate-btn" id="gateOut">退出登录</button>');
    document.getElementById('gateOut').onclick = function () {
      sb.auth.signOut().then(function () { location.reload(); });
    };
  }

  function renderEmailSent(email) {
    showGate(gateLogo() + '<h2>📧 去邮箱点确认链接</h2>' +
      '<p class="gate-sub">验证邮件已发送到 <b>' + esc(email) + '</b><br>' +
      '点开邮件里的链接即可回到本站（可能在垃圾箱）</p>');
  }

  function renderUserBar(email, isAdmin) {
    var bar = document.getElementById('userBar');
    bar.innerHTML = '<span class="ub-mail">' + esc(email) + '</span>' +
      (isAdmin ? '<a href="#!" class="ub-out" id="ubAdmin">🛠 管理</a>' : '') +
      '<a href="#!" class="ub-out" id="ubOut">退出</a>';
    if (isAdmin) {
      document.getElementById('ubAdmin').onclick = function (e) { e.preventDefault(); openAdmin(); };
    }
    document.getElementById('ubOut').onclick = function (e) {
      e.preventDefault();
      sb.auth.signOut().then(function () { location.reload(); });
    };
  }

  function openAdmin() {
    var root = document.getElementById('admRoot');
    root.innerHTML = '<div class="adm-overlay" id="admMask"><div class="adm-card">' +
      '<button type="button" class="adm-close" id="admClose">×</button>' +
      '<h2>🛠 站长后台</h2>' +
      '<div class="adm-sec"><div class="adm-sec-title">🔔 待审核</div><div id="admPending"><div class="adm-empty">加载中…</div></div></div>' +
      '<div class="adm-sec"><div class="adm-sec-title">👥 会员管理</div><div id="admApproved"><div class="adm-empty">加载中…</div></div></div>' +
      '<div class="adm-sec"><div class="adm-sec-title">📦 数据状态</div><div id="admDays"><div class="adm-empty">加载中…</div></div></div>' +
      '<div class="adm-msg" id="admMsg"></div>' +
      '</div></div>';
    document.getElementById('admClose').onclick = closeAdmin;
    document.getElementById('admMask').onclick = function (e) { if (e.target === this) closeAdmin(); };
    loadAdmin();
  }
  function closeAdmin() { document.getElementById('admRoot').innerHTML = ''; }
  function admErr(t) {
    var el = document.getElementById('admMsg');
    if (el) el.textContent = t;
  }
  function memberRow(m, actionHtml) {
    return '<div class="adm-row"><span class="am">' + esc(m.email) + (m.is_admin ? ' 👑' : '') + '</span>' + actionHtml + '</div>';
  }
  function loadAdmin() {
    admErr('');
    Promise.all([sb.rpc('list_members'), sb.rpc('list_days')]).then(function (rs) {
      var rm = rs[0], rd = rs[1];
      if (rm.error) {
        admErr('会员列表加载失败：' + rm.error.message);
        document.getElementById('admPending').innerHTML = '<div class="adm-empty">加载失败</div>';
        document.getElementById('admApproved').innerHTML = '<div class="adm-empty">加载失败</div>';
        return;
      }
      var members = rm.data || [];
      var pending = members.filter(function (m) { return !m.approved; });
      var approved = members.filter(function (m) { return m.approved; });
      document.getElementById('admPending').innerHTML = pending.length === 0
        ? '<div class="adm-empty">没有待审核的账号</div>'
        : pending.map(function (m) {
            return memberRow(m, '<button type="button" class="adm-btn" data-approve="' + m.user_id + '">通过</button>');
          }).join('');
      document.getElementById('admApproved').innerHTML = approved.length === 0
        ? '<div class="adm-empty">暂无会员</div>'
        : approved.map(function (m) {
            return memberRow(m, m.is_admin ? '' : '<button type="button" class="adm-btn revoke" data-revoke="' + m.user_id + '">撤销</button>');
          }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('[data-approve]'), function (b) {
        b.onclick = function () {
          b.disabled = true;
          sb.rpc('approve_member', { target: b.getAttribute('data-approve') }).then(function (r) {
            if (r.error) { admErr('通过失败：' + r.error.message); b.disabled = false; return; }
            loadAdmin();
          }).catch(function () { admErr('网络异常，请稍后重试'); b.disabled = false; });
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-revoke]'), function (b) {
        b.onclick = function () {
          if (!window.confirm('确定撤销该会员的访问资格？')) return;
          b.disabled = true;
          sb.rpc('revoke_member', { target: b.getAttribute('data-revoke') }).then(function (r) {
            if (r.error) { admErr('撤销失败：' + r.error.message); b.disabled = false; return; }
            loadAdmin();
          }).catch(function () { admErr('网络异常，请稍后重试'); b.disabled = false; });
        };
      });
      if (rd.error) { document.getElementById('admDays').innerHTML = '<div class="adm-empty">数据状态加载失败</div>'; return; }
      var days = rd.data || [];
      document.getElementById('admDays').innerHTML = days.length === 0
        ? '<div class="adm-empty">暂无数据</div>'
        : days.map(function (d) {
            return '<div class="adm-row"><span class="am">' + esc(d.date) + ' · ' + d.matches + ' 场</span>' +
              '<span>' + esc(new Date(d.updated_at).toLocaleString('zh-CN', { hour12: false })) + '</span></div>';
          }).join('');
    }).catch(function () { admErr('网络异常，请稍后重试'); });
  }

  function renderAuth() {
    showGate(gateLogo() +
      '<h2>🐻 AI小熊 · 会员门</h2>' +
      '<p class="gate-sub">小圈子分享站，登录且通过审核后可见</p>' +
      '<div class="gate-tabs"><button type="button" id="tabLogin" class="gate-tab active">登录</button><button type="button" id="tabSignup" class="gate-tab">注册</button></div>' +
      '<form id="gateForm" novalidate>' +
      '<input id="gateEmail" type="email" placeholder="邮箱" autocomplete="email">' +
      '<input id="gatePwd" type="password" placeholder="密码（至少6位）" autocomplete="current-password">' +
      '<div class="gate-msg" id="gateMsg"></div>' +
      '<button id="gateGo" class="gate-btn" type="submit">登录</button>' +
      '</form>' +
      '<p class="gate-tip">没有账号？点上方「注册」，提交后先去邮箱点确认链接 📧</p>');
    var mode = 'login';
    var tabL = document.getElementById('tabLogin'), tabS = document.getElementById('tabSignup');
    var btn = document.getElementById('gateGo'), msgEl = document.getElementById('gateMsg');
    function setMode(m) {
      mode = m;
      tabL.className = 'gate-tab' + (m === 'login' ? ' active' : '');
      tabS.className = 'gate-tab' + (m === 'signup' ? ' active' : '');
      btn.textContent = m === 'login' ? '登录' : '注册';
      msgEl.textContent = '';
      document.getElementById('gatePwd').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    }
    tabL.onclick = function () { setMode('login'); };
    tabS.onclick = function () { setMode('signup'); };
    document.getElementById('gateForm').onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById('gateEmail').value.trim();
      var pwd = document.getElementById('gatePwd').value;
      if (!email || pwd.length < 6) { msgEl.textContent = '请填邮箱，密码至少 6 位'; return; }
      btn.disabled = true;
      var done = function () { btn.disabled = false; };
      if (mode === 'login') {
        sb.auth.signInWithPassword({ email: email, password: pwd }).then(function (res) {
          done();
          if (res.error) {
            msgEl.textContent = /email not confirmed/i.test(res.error.message)
              ? '邮箱还未验证：请先到邮箱点确认链接（可能在垃圾箱）'
              : '登录失败：' + res.error.message;
            return;
          }
          location.reload();
        });
      } else {
        sb.auth.signUp({ email: email, password: pwd }).then(function (res) {
          done();
          if (res.error) { msgEl.textContent = '注册失败：' + res.error.message; return; }
          if (res.data && res.data.session) { renderPending(email); return; }
          renderEmailSent(email);
        });
      }
    };
  }

  sb.auth.getSession().then(function (res) {
    var session = res && res.data ? res.data.session : null;
    if (!session) { renderAuth(); return; }
    sb.from('members').select('approved, is_admin').eq('user_id', session.user.id).single()
      .then(function (r2) {
        if (!r2.data || !r2.data.approved) { renderPending(session.user.email || ''); return; }
        renderUserBar(session.user.email || '', !!r2.data.is_admin);
        sb.from('prediction_days').select('payload').order('date', { ascending: false })
          .then(function (r3) {
            if (r3.error || !r3.data || r3.data.length === 0) { showGateError('数据拉取失败，请稍后刷新'); return; }
            renderApp(r3.data.map(function (row) { return row.payload; }));
          });
      })
      .catch(function () { renderPending(session.user.email || ''); });
  }).catch(function () { showGateError('登录状态检查失败，请刷新重试'); });
})();

function renderApp(days) {
  var banner = document.getElementById('errorBanner');
  if (!Array.isArray(days)) {
    banner.hidden = false;
    banner.textContent = '🐻 小熊找不到预测数据，请稍后刷新试试。';
    document.getElementById('dataInfo').textContent = '数据加载失败';
    return;
  }
  document.getElementById('dataInfo').textContent =
    '小熊已记录 ' + days.length + ' 天 · 最新：' + (days[0] ? days[0].date : '—') + ' 🐾';

  function pct(r) { return r === null ? '—' : Math.round(r * 100) + '%'; }
  function planBadge(t) {
    var map = { hit: ' 🔴', miss: ' ⚫', half: ' 🌗', push: ' ➖' };
    return (t && t.result && map.hasOwnProperty(t.result)) ? map[t.result] : '';
  }
  function frac(b) { return b.score + '/' + b.total; }

  var TIER_COLORS = ['#2F9E63', '#D97706', '#F25C5C', '#0284C7', '#8B5CF6', '#B7791F'];

  // ---- 左侧栏：每日红黑（方向命中=红，失手=黑；最近一天明细展开，其余日期折叠可点开） ----
  renderHonghei(days);
  function renderHonghei(days) {
    var side = document.getElementById('hongheiSidebar');
    var totR = 0, totB = 0;
    var rows = days.map(function (day, di) {
      var hits = [], matchRows = [];
      (day.matches || []).forEach(function (m) {
        var v = StatsLib.judgeDirection(m.direction, m.finalScore);
        if (v === null) return;
        hits.push(v);
        matchRows.push('<div class="hh-match" title="' + esc(m.id) + ' ' + esc(m.home) + ' vs ' + esc(m.away) + ' · 预测' + esc(m.direction) + '">' +
          '<span class="dot ' + (v === 1 ? 'red' : 'black') + '"></span>' +
          '<span class="hh-mid">' + esc(m.id) + ' ' + esc(m.home) + ' <span class="hh-score">' + esc(m.finalScore) + '</span> ' + esc(m.away) + '</span></div>');
      });
      var red = hits.filter(function (v) { return v === 1; }).length;
      var black = hits.filter(function (v) { return v === 0; }).length;
      totR += red; totB += black;
      var ds = StatsLib.computeDayStats(day);
      var body = matchRows.length > 0 ? matchRows.join('') : '';
      if (ds.pending > 0) body += '<div><span class="hh-pending">🍯 待回填 ' + ds.pending + ' 场</span></div>';
      var cnt = hits.length === 0 ? '' : '<span class="cnt"><span class="r">' + red + '红</span> <span class="b">' + black + '黑</span></span>';
      return '<div class="hh-day' + (di === 0 ? ' open' : '') + '"><div class="hh-date"><span>' + esc(day.date.slice(5)) + '</span>' + cnt + '<span class="hh-arrow">▼</span></div><div class="hh-body">' + body + '</div></div>';
    }).join('');
    var total = (totR + totB) > 0
      ? '<div class="hh-total">累计 <span class="r">' + totR + ' 红</span> · <span class="b">' + totB + ' 黑</span></div>'
      : '';
    side.innerHTML = '<h2 class="hh-side-title">📓 每日红黑</h2>' + total + rows;
    Array.prototype.forEach.call(side.querySelectorAll('.hh-date'), function (el) {
      el.addEventListener('click', function () { el.parentElement.classList.toggle('open'); });
    });
  }

  // ---- 中间首页：最新一天方案方块（竞彩/标准大小盘分组，点击跳转详解弹窗） ----
  renderPlanBlocks(days);
  function renderPlanBlocks(days) {
    var box = document.getElementById('planBlocks');
    var day = days.find(function (d) { return Array.isArray(d.plan) && d.plan.length > 0; });
    if (!day) { box.innerHTML = ''; return; }
    // 比赛全部结束的日子：方案内容折叠为一条可展开横条
    var dayEnded = (day.matches || []).length > 0 && day.matches.every(function (m) { return !!m.finalScore; });
    var bodyHtml = buildPlanBody(day);
    if (dayEnded) {
      box.innerHTML =
        '<div class="plan-fold" id="planFoldBar">💰 ' + esc(day.date) + ' 投资方案（比赛已结束 · 点击展开）<span class="pf-arrow">▼</span></div>' +
        '<div id="planFoldBody" style="display:none">' + bodyHtml + '</div>';
      document.getElementById('planFoldBar').addEventListener('click', function () {
        var b = document.getElementById('planFoldBody');
        var open = b.style.display !== 'none';
        b.style.display = open ? 'none' : 'block';
        this.querySelector('.pf-arrow').textContent = open ? '▼' : '▲';
      });
      return;
    }
    box.innerHTML = bodyHtml;
  }
  function buildPlanBody(day) {
    var groups = [
      { key: 'jc', title: '🇨🇳 竞彩方案', tag: '胜平负/让球/比分，官方SP' },
      { key: 'std', title: '📊 标准盘', tag: '亚洲让球/大小盘，主流盘口单独结算' },
    ];
    var html = '<h2 class="sec-title" style="margin-top:4px">💰 ' + esc(day.date) + ' 投资方案<span class="sec-sub">点方块看详解</span></h2>';
    groups.forEach(function (g) {
      var tiers = day.plan.map(function (t, i) { return { t: t, i: i }; })
        .filter(function (x) { return (x.t.market || 'jc') === g.key; });
      if (tiers.length === 0) return;
      html += '<div class="plan-group-title">' + g.title + '<span class="pg-tag">' + g.tag + '</span></div>' +
        '<div class="plan-blocks">' + tiers.map(function (x) {
          var c = TIER_COLORS[x.i % TIER_COLORS.length];
          return '<a class="plan-block" href="#tier-' + esc(day.date) + '-' + x.i + '" style="border-top-color:' + c + '">' +
            '<div class="pb-head">' + esc(x.t.name) + planBadge(x.t) + '</div>' +
            '<div class="pb-pct" style="color:' + c + '">' + esc(x.t.pct) + '</div>' +
            '<div class="pb-text">' + esc(x.t.text) + '</div>' +
            '<div class="pb-more">详解 ↗</div></a>';
        }).join('') + '</div>';
    });
    html += (day.planNote ? '<div class="plan-note">⚠️ ' + esc(day.planNote) + '</div>' : '');
    if (Array.isArray(day.actualBets) && day.actualBets.length > 0) {
      html += '<div class="plan-group-title">🧾 实际投注<span class="pg-tag">票样留档 · 点击放大</span></div>' +
        '<div class="bet-gallery">' + day.actualBets.map(function (b, i) {
          return '<a class="bet-thumb" href="#bet-' + esc(day.date) + '-' + i + '"><img src="' + esc(b.img) + '" alt="实际投注票样" loading="lazy"><div class="bt-zoom">点击放大 🔍</div></a>' +
            (b.note ? '<div class="bet-note">' + esc(b.note) + '</div>' : '');
        }).join('') + '</div>';
    }
    if (day.analysis) {
      html += '<a class="analysis-link" href="#analysis-' + esc(day.date) + '"><span>📋 ' +
        esc(day.date.slice(5).replace('-', '')) + ' 完整分析</span><span class="al-sub">日柱框架 · 五式判定 · 逐场拆解 ↗</span></a>';
    }
    if (day.fivePillars) {
      html += '<a class="analysis-link" href="#wushi-' + esc(day.date) + '"><span>☯️ ' +
        esc(day.date.slice(5).replace('-', '')) + ' 五式详解</span><span class="al-sub">八字 · 紫微 · 奇门 · 六壬 · 六爻 ↗</span></a>';
    }
    return html;
  }

  // ---- 方案详解弹窗（每天每层一个，hash :target 打开） ----
  renderPlanModals(days);
  function renderPlanModals(days) {
    var html = '';
    days.forEach(function (day) {
      (Array.isArray(day.plan) ? day.plan : []).forEach(function (t, i) {
        var c = TIER_COLORS[i % TIER_COLORS.length];
        html += '<div class="modal" id="tier-' + esc(day.date) + '-' + i + '">' +
          '<a class="modal-mask" href="#!"></a>' +
          '<div class="modal-box" style="border-top:4px solid ' + c + '">' +
          '<a class="modal-close" href="#!">×</a>' +
          '<h3>' + esc(t.name) + planBadge(t) + '<span class="m-pct">' + esc(t.pct) + '</span><span class="m-date">' + esc(day.date) + ' · ' + ((t.market || 'jc') === 'std' ? '标准盘' : '竞彩') + '</span></h3>' +
          '<div class="modal-text">' + esc(t.detail || t.text) + '</div>' +
          '</div></div>';
      });
      if (day.analysis) {
        html += '<div class="modal" id="analysis-' + esc(day.date) + '">' +
          '<a class="modal-mask" href="#!"></a>' +
          '<div class="modal-box" style="border-top:4px solid var(--honey)">' +
          '<a class="modal-close" href="#!">×</a>' +
          '<h3>📋 ' + esc(day.date) + ' 完整分析</h3>' +
          '<div class="modal-text">' + esc(day.analysis) + '</div>' +
          '</div></div>';
      }
      if (day.fivePillars) {
        html += '<div class="modal" id="wushi-' + esc(day.date) + '">' +
          '<a class="modal-mask" href="#!"></a>' +
          '<div class="modal-box" style="border-top:4px solid #8B5CF6">' +
          '<a class="modal-close" href="#!">×</a>' +
          '<h3>☯️ ' + esc(day.date) + ' 五式详解（八字 · 紫微 · 奇门 · 六壬 · 六爻）</h3>' +
          '<div class="modal-text">' + esc(day.fivePillars) + '</div>' +
          '</div></div>';
      }
      (Array.isArray(day.actualBets) ? day.actualBets : []).forEach(function (b, i) {
        html += '<div class="modal" id="bet-' + esc(day.date) + '-' + i + '">' +
          '<a class="modal-mask" href="#!"></a>' +
          '<img class="modal-img" src="' + esc(b.img) + '" alt="实际投注票样">' +
          '</div>';
      });
    });
    document.getElementById('planModals').innerHTML = html;
  }

  // ---- 方案层命中面板（6类固定顺序；样本<3 显示「样本不足」） ----
  renderPlanStats(days);
  function renderPlanStats(days) {
    var body = document.getElementById('planStatsBody');
    if (!body || typeof StatsLib.planStats !== 'function') return;
    var stats = StatsLib.planStats(days);
    var any = stats.some(function (s) { return s.total > 0 || s.push > 0; });
    if (!any) {
      body.innerHTML = '<div class="wait" style="font-size:12.5px">方案复盘回填后，这里会出现每层命中统计 🐾</div>';
      return;
    }
    body.innerHTML = stats.map(function (s) {
      var cnt = (s.total === 0 && s.push === 0)
        ? '<span class="wait">暂无数据</span>'
        : '<span class="r">' + s.hit + '红</span> <span class="b">' + s.miss + '黑</span>' +
          (s.half > 0 ? ' <span class="h">' + s.half + '半</span>' : '') +
          (s.push > 0 ? ' <span class="p">' + s.push + '走水</span>' : '');
      var enough = s.total >= 3;
      var rateTxt = enough ? pct(s.rate) : (s.total === 0 ? '—' : '样本不足');
      var dots = s.last14.map(function (p) {
        var cls = p.result === 'hit' ? 'red' : p.result === 'miss' ? 'black' : p.result === 'half' ? 'half' : 'push';
        return '<span class="dot ' + cls + '" title="' + esc(p.date) + '"></span>';
      }).join('');
      return '<div class="ps-row"><span class="ps-name">' + s.type + '</span>' +
        '<span class="ps-cnt">' + cnt + '</span><span class="ps-dots">' + dots + '</span>' +
        '<span class="ps-rate' + (enough ? '' : ' na') + '">' + rateTxt + '</span></div>';
    }).join('');
  }

  // ---- 小熊成绩单 ----
  var ov = StatsLib.computeOverall(days);
  function card(num, lbl) { return '<div class="card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'; }
  document.getElementById('statCards').innerHTML =
    card(pct(ov.direction.rate), '🎯 方向命中率（' + frac(ov.direction) + '）') +
    card(pct(ov.overUnder.rate), '⚽ 大小球命中率（' + frac(ov.overUnder) + '）') +
    card(pct(ov.score.rate), '🏅 比分命中率（' + frac(ov.score) + '）') +
    card(ov.matches, '📋 总场次（待回填 ' + ov.pending + '）');

  // ---- 近14日走势 ----
  renderTrend(StatsLib.computeTrend(days, 14));
  function renderTrend(points) {
    var svg = document.getElementById('trendChart');
    if (points.length < 2) { svg.innerHTML = '<text x="20" y="110">小熊还在攒数据，复盘满 2 天后显示走势 🐾</text>'; return; }
    var W = 720, H = 220, padL = 40, padR = 16, padT = 16, padB = 34;
    var iw = W - padL - padR, ih = H - padT - padB;
    function x(i) { return padL + iw * i / (points.length - 1); }
    function y(r) { return padT + ih * (1 - r); }
    var html = '';
    [0, 0.5, 1].forEach(function (g) {
      html += '<line x1="' + padL + '" y1="' + y(g) + '" x2="' + (W - padR) + '" y2="' + y(g) + '" stroke="#F0E2CC" stroke-dasharray="4"/>' +
              '<text x="6" y="' + (y(g) + 4) + '">' + Math.round(g * 100) + '%</text>';
    });
    html += '<polyline points="' + points.map(function (p, i) { return x(i) + ',' + y(p.rate); }).join(' ') +
            '" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>';
    points.forEach(function (p, i) {
      html += '<circle cx="' + x(i) + '" cy="' + y(p.rate) + '" r="5" fill="#F5A623" stroke="#fff" stroke-width="2"/>' +
              '<text x="' + (x(i) - 14) + '" y="' + (y(p.rate) - 10) + '">' + Math.round(p.rate * 100) + '%</text>' +
              '<text x="' + (x(i) - 22) + '" y="' + (H - 10) + '">' + p.date.slice(5) + '</text>';
    });
    svg.innerHTML = html;
  }

  // ---- 联赛分布 ----
  var lt = document.getElementById('leagueTable');
  if (ov.byLeague.length === 0) {
    lt.innerHTML = '<tr><td class="wait">暂无已复盘场次，小熊等赛果中…</td></tr>';
  } else {
    lt.innerHTML = '<tr><th>联赛</th><th>命中/场次</th><th>命中率</th></tr>' + ov.byLeague.map(function (l) {
      return '<tr><td>' + esc(l.league) + '</td><td>' + l.score + '/' + l.total + '</td><td>' + pct(l.rate) + '</td></tr>';
    }).join('');
  }

  // ---- 每日记录 ----
  var list = document.getElementById('dailyList');
  if (days.length === 0) {
    list.innerHTML = '<div class="panel wait">还没有记录，等小熊的第一场预测 🐻</div>';
    return;
  }
  list.innerHTML = days.map(function (d, i) { return dayCard(d, i === 0); }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.day-head'), function (el) {
    el.addEventListener('click', function () { el.parentElement.classList.toggle('open'); });
  });

  function dayCard(day, isToday) {
    var ds = StatsLib.computeDayStats(day);
    var badge = ds.pending > 0
      ? '<span class="badge pending">🍯 待回填 ' + ds.pending + ' 场</span>'
      : '<span class="badge good">⚽ 方向 ' + ds.direction.score + '/' + ds.direction.total + '</span>';
    var tiers = (Array.isArray(day.plan) && day.plan.length > 0)
      ? '<div class="mini-tiers">' + day.plan.map(function (t, i) {
          return '<a class="mini-tier-link" href="#tier-' + esc(day.date) + '-' + i + '">' +
            '<div class="mini-tier" style="border-left-color:' + TIER_COLORS[i % TIER_COLORS.length] + '">' +
            '<b>' + ((t.market || 'jc') === 'std' ? '📊 ' : '🇨🇳 ') + esc(t.name) + ' ' + esc(t.pct) + planBadge(t) + '</b><br>' + esc(t.text) + '</div></a>';
        }).join('') + '</div>'
      : '';
    return '<div class="day-card' + (isToday ? ' open' : '') + '" id="day-' + esc(day.date) + '">' +
      '<div class="day-head"><div><div class="day-title">' + esc(day.date) + '</div>' +
      '<div class="day-meta">' + esc(day.dayPillar || '') + (day.dayNote ? ' · ' + esc(day.dayNote) : '') + ' · ' + ds.matches + ' 场</div></div>' +
      badge + '</div>' +
      '<div class="day-body">' + matchTable(day) + tiers +
      (day.analysis ? '<a class="analysis-link" href="#analysis-' + esc(day.date) + '"><span>📋 ' + esc(day.date.slice(5).replace('-', '')) + ' 完整分析</span><span class="al-sub">↗</span></a>' : '') +
      (day.fivePillars ? '<a class="analysis-link" href="#wushi-' + esc(day.date) + '"><span>☯️ ' + esc(day.date.slice(5).replace('-', '')) + ' 五式详解</span><span class="al-sub">↗</span></a>' : '') +
      (day.planNote ? '<div class="plan-note">⚠️ ' + esc(day.planNote) + '</div>' : '') +
      (day.review ? '<div class="review"><b>🔍 复盘结论：</b>' + esc(day.review) + '</div>' : '') +
      '</div></div>';
  }

  function mark(v) {
    if (v === null) return '<span class="wait">—</span>';
    if (v === 1) return '<span class="hit">✅</span>';
    if (v === 0.5) return '<span class="half">半✅</span>';
    return '<span class="miss">❌</span>';
  }

  function matchTable(day) {
    var rows = day.matches.map(function (m) {
      var pending = !m.finalScore;
      var judge = pending ? '<span class="wait">—</span>'
        : mark(StatsLib.judgeDirection(m.direction, m.finalScore)) + ' ' +
          mark(StatsLib.judgeOverUnder(m.overUnder, m.finalScore)) + ' ' +
          mark(StatsLib.judgeScore(m.score, m.finalScore));
      var spCell = '<span class="wait">—</span>';
      if (Array.isArray(m.sp) && m.sp.length === 3) {
        var hotIdx = m.direction === '主胜' ? 0 : m.direction === '平' ? 1 : m.direction === '客胜' ? 2 : -1;
        var spTxt = m.sp.map(function (v, i) {
          return i === hotIdx ? '<b class="sp-hot">' + esc(v) + '</b>' : esc(v);
        }).join(' / ');
        spCell = (m.spHandicap ? '<span class="sp-hcp">让' + esc(m.spHandicap) + '</span>' : '') + '<span class="sp">' + spTxt + '</span>';
      }
      return '<tr><td>' + esc(m.id) + '</td><td>' + esc(m.league) + ' ' + esc(m.time) + '</td>' +
        '<td>' + esc(m.home) + ' vs ' + esc(m.away) + '</td>' +
        '<td>' + esc(m.direction) + ' / ' + esc(m.overUnder) + ' / ' + esc((m.score || []).join(' ')) +
        ' <span class="stars">' + '★'.repeat(m.confidence || 0) + '</span></td>' +
        '<td>' + spCell + '</td>' +
        '<td>' + judge + '</td></tr>';
    }).join('');
    return '<table><tr><th>编号</th><th>联赛/时间</th><th>对阵</th><th>预测（方向/大小/比分）</th><th>SP（胜/平/负）</th><th>判定（方向/大小/比分）</th></tr>' + rows + '</table>';
  }
}
</script>
</body>
</html>
