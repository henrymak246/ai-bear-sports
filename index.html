<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI小熊 · 体育心得分享</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
  :root {
    --cream:#FFF6E9; --card:#FFFDF8; --line:#F0E2CC;
    --brown:#8B5A2B; --brown-soft:#B98A5E; --muted:#A8A29E;
    --honey:#F5A623; --honey-dark:#D97706;
    --green:#2F9E63; --green-bg:#E8F7EE;
    --coral:#F25C5C; --amber-bg:#FFF1D6;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:linear-gradient(160deg,#FFF9EE 0%,#FFEFD2 55%,#FFE7BD 100%);
    min-height:100vh;
    color:#4A3A28; font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    padding:24px; max-width:1240px; margin:0 auto;
  }
  header { display:flex; align-items:center; gap:16px; padding:6px 4px 0; }
  header img { width:78px; height:78px; filter:drop-shadow(0 3px 6px rgba(139,90,43,.25)); }
  header h1 { font-size:26px; color:var(--brown); letter-spacing:1px; }
  header h1 .paw { font-size:22px; }
  .sub { color:var(--brown-soft); font-size:13px; margin-top:6px; }
  .error { background:#FDE2E2; color:#B91C1C; border:1px solid #F5B5B5; padding:12px 16px; border-radius:14px; margin:16px 0; }

  .layout { display:flex; gap:18px; align-items:flex-start; margin-top:20px; }
  aside { width:250px; flex:none; position:sticky; top:18px; }
  main { flex:1; min-width:0; }

  /* ---- 左侧栏：每日红黑 ---- */
  .hh-side-title { font-size:16px; color:var(--brown); margin-bottom:12px; }
  .hh-total {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    margin-bottom:12px; box-shadow:0 4px 14px rgba(169,113,61,.10);
    font-size:13px; font-weight:800; color:var(--brown);
  }
  .hh-total .r { color:var(--coral); } .hh-total .b { color:#3A3A3A; }
  .hh-day {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 13px;
    margin-bottom:10px; box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .hh-day:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(169,113,61,.16); }
  .hh-date { font-size:12.5px; font-weight:800; color:var(--brown); display:flex; justify-content:space-between; align-items:center; }
  .hh-date .cnt { font-size:11px; font-weight:700; }
  .hh-date .cnt .r { color:var(--coral); } .hh-date .cnt .b { color:#3A3A3A; }
  .hh-dots { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .dot { width:11px; height:11px; border-radius:50%; box-shadow:inset 0 -2px 3px rgba(0,0,0,.18); }
  .dot.red { background:var(--coral); }
  .dot.black { background:#3A3A3A; }
  .hh-pending { font-size:11.5px; color:var(--honey-dark); background:var(--amber-bg); border-radius:8px; padding:3px 9px; margin-top:8px; display:inline-block; }

  /* ---- 中间首页：方案方块 ---- */
  .plan-blocks { display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:12px; }
  .plan-block {
    background:#FFF8EC; border:1px solid var(--line); border-top:4px solid var(--honey);
    border-radius:14px; padding:14px; display:block; text-decoration:none; color:inherit;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .plan-block:hover { transform:translateY(-3px); box-shadow:0 8px 18px rgba(169,113,61,.16); }
  .plan-block .pb-head { font-size:12.5px; font-weight:700; color:var(--brown); }
  .plan-block .pb-pct { font-size:24px; font-weight:800; margin:2px 0 6px; }
  .plan-block .pb-text { font-size:12px; color:var(--brown-soft); line-height:1.65; }
  .plan-block .pb-more { font-size:11px; color:var(--honey-dark); margin-top:8px; font-weight:700; }
  .plan-note { font-size:12px; color:var(--honey-dark); background:var(--amber-bg); border-radius:10px; padding:8px 12px; margin-top:12px; line-height:1.65; }
  .plan-group-title { font-size:13.5px; font-weight:800; color:var(--brown); margin:16px 0 10px; display:flex; align-items:center; gap:8px; }
  .plan-group-title:first-of-type { margin-top:0; }
  .plan-group-title .pg-tag { font-size:10.5px; color:var(--muted); font-weight:400; }
  .analysis-link {
    display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
    font-size:13.5px; font-weight:800; color:var(--brown); text-decoration:none;
    box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .analysis-link:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(169,113,61,.16); color:var(--honey-dark); }
  .analysis-link .al-sub { font-size:11px; color:var(--muted); font-weight:400; }
  .poster-frame {
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(169,113,61,.22); margin-bottom:18px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .poster-frame:hover { transform:translateY(-3px); box-shadow:0 14px 32px rgba(169,113,61,.28); }
  .poster-frame img { width:100%; display:block; }
  .poster-overlay { position:absolute; top:14px; left:24px; }
  .poster-overlay h2 { font-size:46px; font-weight:900; color:#8B5A2B; letter-spacing:3px;
    text-shadow:0 2px 10px #FFF, 0 0 4px #FFF, 0 0 14px #FFF, 0 0 20px #FFF; }
  .poster-overlay p { font-size:20px; font-weight:800; color:#D97706; letter-spacing:6px; margin-top:2px;
    text-shadow:0 1px 8px #FFF, 0 0 4px #FFF, 0 0 10px #FFF; }
  .poster-badges { position:absolute; top:18px; right:20px; display:flex; gap:8px; }
  .poster-badges span { background:rgba(255,255,255,.88); border-radius:999px; padding:5px 12px;
    font-size:12px; font-weight:700; color:var(--brown); box-shadow:0 2px 6px rgba(139,90,43,.18); }
  @media (max-width: 920px) {
    .poster-overlay h2 { font-size:26px; }
    .poster-overlay p { font-size:13px; letter-spacing:3px; }
    .poster-badges { display:none; }
  }

  /* ---- 方案详解弹窗（:target 纯CSS实现） ---- */
  .modal { display:none; position:fixed; inset:0; z-index:50; }
  .modal:target { display:flex; align-items:center; justify-content:center; }
  .modal-mask { position:absolute; inset:0; background:rgba(74,58,40,.45); }
  .modal-box {
    position:relative; background:var(--card); border-radius:18px; padding:24px;
    max-width:580px; width:92%; max-height:82vh; overflow:auto;
    box-shadow:0 20px 50px rgba(74,58,40,.35);
  }
  .modal-box h3 { font-size:16px; color:var(--brown); padding-right:30px; }
  .modal-box h3 .m-pct { color:var(--honey-dark); margin-left:6px; }
  .modal-box h3 .m-date { font-size:11.5px; color:var(--muted); font-weight:400; margin-left:8px; }
  .modal-close { position:absolute; top:12px; right:16px; font-size:24px; line-height:1; text-decoration:none; color:var(--muted); }
  .modal-close:hover { color:var(--coral); }
  .modal-text { white-space:pre-wrap; font-size:13px; line-height:1.85; color:var(--brown-soft); margin-top:12px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:16px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px;
    box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 22px rgba(169,113,61,.18); }
  .card .num { font-size:30px; font-weight:800; color:var(--honey); }
  .card .lbl { color:var(--brown-soft); font-size:13px; margin-top:5px; }

  .panel {
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px;
    margin-bottom:16px; box-shadow:0 4px 14px rgba(169,113,61,.10);
  }
  .panel h2 { font-size:15px; margin-bottom:12px; color:var(--brown); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px; border-bottom:1px dashed var(--line); text-align:left; }
  th { color:var(--brown-soft); font-weight:700; }
  tr:last-child td { border-bottom:none; }

  .sec-title { margin:20px 0 12px; font-size:16px; color:var(--brown); }
  .sec-title .sec-sub { font-size:12px; color:var(--muted); font-weight:400; margin-left:6px; }

  .day-card {
    background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:14px;
    overflow:hidden; box-shadow:0 4px 14px rgba(169,113,61,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .day-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(169,113,61,.16); }
  .day-head { padding:15px 18px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .day-head:hover { background:#FFF3DE; }
  .day-title { font-weight:800; color:var(--brown); }
  .day-meta { color:var(--brown-soft); font-size:12px; margin-top:4px; }
  .badge { font-size:12px; padding:4px 12px; border-radius:999px; border:1px solid; font-weight:700; }
  .badge.good { color:var(--green); background:var(--green-bg); border-color:#8FD8AC; }
  .badge.pending { color:var(--honey-dark); background:var(--amber-bg); border-color:#F5C96B; }
  .day-body { display:none; padding:2px 18px 18px; }
  .day-card.open .day-body { display:block; }

  .hit { color:var(--green); font-weight:700; } .miss { color:var(--coral); font-weight:700; }
  .half { color:var(--honey-dark); font-weight:700; } .wait { color:var(--muted); }
  .stars { color:var(--honey); }
  .mini-tiers { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-top:12px; }
  .mini-tier-link { text-decoration:none; color:inherit; }
  .mini-tier { background:#FFF8EC; border-left:3px solid var(--honey); border-radius:8px; padding:7px 10px; font-size:12px; color:var(--brown-soft); line-height:1.6; height:100%; }
  .mini-tier-link:hover .mini-tier { background:#FFF1D6; }
  .mini-tier b { color:var(--brown); }
  .review { font-size:13px; color:var(--brown-soft); margin-top:12px; line-height:1.8; white-space:pre-wrap; background:#FFF8EC; border-radius:12px; padding:10px 14px; }
  .review b { color:var(--brown); }

  footer { color:var(--brown-soft); font-size:12px; text-align:center; margin:28px 0 6px; line-height:1.8; }
  svg text { fill:var(--brown-soft); font-size:11px; }

  @media (max-width: 920px) {
    .layout { flex-direction:column; }
    aside { width:100%; position:static; }
  }
</style>
</head>
<body>
<header>
  <img src="assets/logo.svg" alt="AI小熊">
  <div>
    <h1>AI小熊 · 体育心得分享 <span class="paw">🐾</span></h1>
    <p class="sub" id="dataInfo">小熊加载中…</p>
  </div>
</header>
<div id="errorBanner" class="error" hidden></div>

<div class="layout">
  <aside id="hongheiSidebar"></aside>
  <main>
    <div class="cards" id="statCards"></div>
    <div id="planBlocks"></div>

    <div class="panel">
      <h2>📈 近14日方向命中率</h2>
      <svg id="trendChart" viewBox="0 0 720 220" width="100%"></svg>
    </div>

    <div class="panel">
      <h2>🏆 联赛分布（方向命中）</h2>
      <table id="leagueTable"></table>
    </div>

    <h2 class="sec-title">📅 每日预测记录</h2>
    <div id="dailyList"></div>
  </main>
</div>

<div id="planModals"></div>

<footer>🐻 小熊提醒：仅供娱乐参考，不构成投资建议<br>五式足球预测法 V2.6 驱动 · 数据由 AI 小熊每日维护</footer>

<script src="data/predictions.js"></script>
<script src="stats.js"></script>
<script>
(function () {
  var banner = document.getElementById('errorBanner');
  if (typeof PREDICTION_DAYS === 'undefined' || !Array.isArray(PREDICTION_DAYS)) {
    banner.hidden = false;
    banner.textContent = '🐻 小熊找不到数据文件 data/predictions.js（或格式有误），检查后刷新试试。';
    document.getElementById('dataInfo').textContent = '数据加载失败';
    return;
  }
  var days = PREDICTION_DAYS;
  document.getElementById('dataInfo').textContent =
    '小熊已记录 ' + days.length + ' 天 · 最新：' + (days[0] ? days[0].date : '—') + ' 🐾';

  function pct(r) { return r === null ? '—' : Math.round(r * 100) + '%'; }
  function frac(b) { return b.score + '/' + b.total; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var TIER_COLORS = ['#2F9E63', '#D97706', '#F25C5C', '#0284C7', '#8B5CF6', '#B7791F'];

  // ---- 左侧栏：每日红黑（方向命中=红，失手=黑） ----
  renderHonghei(days);
  function renderHonghei(days) {
    var side = document.getElementById('hongheiSidebar');
    var totR = 0, totB = 0;
    var rows = days.map(function (day) {
      var hits = (day.matches || []).map(function (m) { return StatsLib.judgeDirection(m.direction, m.finalScore); })
        .filter(function (v) { return v !== null; });
      var red = hits.filter(function (v) { return v === 1; }).length;
      var black = hits.filter(function (v) { return v === 0; }).length;
      totR += red; totB += black;
      var ds = StatsLib.computeDayStats(day);
      var body = ds.pending > 0
        ? '<div><span class="hh-pending">🍯 待回填 ' + ds.pending + ' 场</span></div>'
        : '<div class="hh-dots">' + hits.map(function (v) {
            return '<span class="dot ' + (v === 1 ? 'red' : 'black') + '"></span>';
          }).join('') + '</div>';
      var cnt = ds.pending > 0 ? '' : '<span class="cnt"><span class="r">' + red + '红</span> <span class="b">' + black + '黑</span></span>';
      return '<div class="hh-day"><div class="hh-date"><span>' + esc(day.date.slice(5)) + '</span>' + cnt + '</div>' + body + '</div>';
    }).join('');
    var total = (totR + totB) > 0
      ? '<div class="hh-total">累计 <span class="r">' + totR + ' 红</span> · <span class="b">' + totB + ' 黑</span></div>'
      : '';
    side.innerHTML = '<h2 class="hh-side-title">📓 每日红黑</h2>' + total + rows;
  }

  // ---- 中间首页：最新一天方案方块（竞彩/标准大小盘分组，点击跳转详解弹窗） ----
  renderPlanBlocks(days);
  function renderPlanBlocks(days) {
    var box = document.getElementById('planBlocks');
    var day = days.find(function (d) { return Array.isArray(d.plan) && d.plan.length > 0; });
    if (!day) { box.innerHTML = ''; return; }
    var groups = [
      { key: 'jc', title: '🇨🇳 竞彩方案', tag: '胜平负/让球/比分，官方SP' },
      { key: 'std', title: '📊 标准盘', tag: '亚洲让球/大小盘，主流盘口单独结算' },
    ];
    var html = '<div class="poster-frame"><img src="assets/ai-poster.png" alt="AI小熊主题海报">' +
      '<div class="poster-overlay"><h2>AI小熊</h2><p>体育心得分享</p></div>' +
      '<div class="poster-badges"><span>⚽ 竞彩方案</span><span>📊 标准盘</span><span>🐻 每日红黑</span></div>' +
      '</div>' +
      '<h2 class="sec-title" style="margin-top:4px">💰 ' + esc(day.date) + ' 投资方案<span class="sec-sub">点方块看详解</span></h2>';
    groups.forEach(function (g) {
      var tiers = day.plan.map(function (t, i) { return { t: t, i: i }; })
        .filter(function (x) { return (x.t.market || 'jc') === g.key; });
      if (tiers.length === 0) return;
      html += '<div class="plan-group-title">' + g.title + '<span class="pg-tag">' + g.tag + '</span></div>' +
        '<div class="plan-blocks">' + tiers.map(function (x) {
          var c = TIER_COLORS[x.i % TIER_COLORS.length];
          return '<a class="plan-block" href="#tier-' + esc(day.date) + '-' + x.i + '" style="border-top-color:' + c + '">' +
            '<div class="pb-head">' + esc(x.t.name) + '</div>' +
            '<div class="pb-pct" style="color:' + c + '">' + esc(x.t.pct) + '</div>' +
            '<div class="pb-text">' + esc(x.t.text) + '</div>' +
            '<div class="pb-more">详解 ↗</div></a>';
        }).join('') + '</div>';
    });
    html += (day.planNote ? '<div class="plan-note">⚠️ ' + esc(day.planNote) + '</div>' : '');
    if (day.analysis) {
      html += '<a class="analysis-link" href="#analysis-' + esc(day.date) + '"><span>📋 ' +
        esc(day.date.slice(5).replace('-', '')) + ' 完整分析</span><span class="al-sub">日柱框架 · 五式判定 · 逐场拆解 ↗</span></a>';
    }
    box.innerHTML = html;
  }

  // ---- 方案详解弹窗（每天每层一个，hash :target 打开） ----
  renderPlanModals(days);
  function renderPlanModals(days) {
    var html = '';
    days.forEach(function (day) {
      (Array.isArray(day.plan) ? day.plan : []).forEach(function (t, i) {
        var c = TIER_COLORS[i % TIER_COLORS.length];
        html += '<div class="modal" id="tier-' + esc(day.date) + '-' + i + '">' +
          '<a class="modal-mask" href="#!"></a>' +
          '<div class="modal-box" style="border-top:4px solid ' + c + '">' +
          '<a class="modal-close" href="#!">×</a>' +
          '<h3>' + esc(t.name) + '<span class="m-pct">' + esc(t.pct) + '</span><span class="m-date">' + esc(day.date) + ' · ' + ((t.market || 'jc') === 'std' ? '标准盘' : '竞彩') + '</span></h3>' +
          '<div class="modal-text">' + esc(t.detail || t.text) + '</div>' +
          '</div></div>';
      });
      if (day.analysis) {
        html += '<div class="modal" id="analysis-' + esc(day.date) + '">' +
          '<a class="modal-mask" href="#!"></a>' +
          '<div class="modal-box" style="border-top:4px solid var(--honey)">' +
          '<a class="modal-close" href="#!">×</a>' +
          '<h3>📋 ' + esc(day.date) + ' 完整分析</h3>' +
          '<div class="modal-text">' + esc(day.analysis) + '</div>' +
          '</div></div>';
      }
    });
    document.getElementById('planModals').innerHTML = html;
  }

  // ---- 小熊成绩单 ----
  var ov = StatsLib.computeOverall(days);
  function card(num, lbl) { return '<div class="card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'; }
  document.getElementById('statCards').innerHTML =
    card(pct(ov.direction.rate), '🎯 方向命中率（' + frac(ov.direction) + '）') +
    card(pct(ov.overUnder.rate), '⚽ 大小球命中率（' + frac(ov.overUnder) + '）') +
    card(pct(ov.score.rate), '🏅 比分命中率（' + frac(ov.score) + '）') +
    card(ov.matches, '📋 总场次（待回填 ' + ov.pending + '）');

  // ---- 近14日走势 ----
  renderTrend(StatsLib.computeTrend(days, 14));
  function renderTrend(points) {
    var svg = document.getElementById('trendChart');
    if (points.length < 2) { svg.innerHTML = '<text x="20" y="110">小熊还在攒数据，复盘满 2 天后显示走势 🐾</text>'; return; }
    var W = 720, H = 220, padL = 40, padR = 16, padT = 16, padB = 34;
    var iw = W - padL - padR, ih = H - padT - padB;
    function x(i) { return padL + iw * i / (points.length - 1); }
    function y(r) { return padT + ih * (1 - r); }
    var html = '';
    [0, 0.5, 1].forEach(function (g) {
      html += '<line x1="' + padL + '" y1="' + y(g) + '" x2="' + (W - padR) + '" y2="' + y(g) + '" stroke="#F0E2CC" stroke-dasharray="4"/>' +
              '<text x="6" y="' + (y(g) + 4) + '">' + Math.round(g * 100) + '%</text>';
    });
    html += '<polyline points="' + points.map(function (p, i) { return x(i) + ',' + y(p.rate); }).join(' ') +
            '" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>';
    points.forEach(function (p, i) {
      html += '<circle cx="' + x(i) + '" cy="' + y(p.rate) + '" r="5" fill="#F5A623" stroke="#fff" stroke-width="2"/>' +
              '<text x="' + (x(i) - 14) + '" y="' + (y(p.rate) - 10) + '">' + Math.round(p.rate * 100) + '%</text>' +
              '<text x="' + (x(i) - 22) + '" y="' + (H - 10) + '">' + p.date.slice(5) + '</text>';
    });
    svg.innerHTML = html;
  }

  // ---- 联赛分布 ----
  var lt = document.getElementById('leagueTable');
  if (ov.byLeague.length === 0) {
    lt.innerHTML = '<tr><td class="wait">暂无已复盘场次，小熊等赛果中…</td></tr>';
  } else {
    lt.innerHTML = '<tr><th>联赛</th><th>命中/场次</th><th>命中率</th></tr>' + ov.byLeague.map(function (l) {
      return '<tr><td>' + esc(l.league) + '</td><td>' + l.score + '/' + l.total + '</td><td>' + pct(l.rate) + '</td></tr>';
    }).join('');
  }

  // ---- 每日记录 ----
  var list = document.getElementById('dailyList');
  if (days.length === 0) {
    list.innerHTML = '<div class="panel wait">还没有记录，等小熊的第一场预测 🐻</div>';
    return;
  }
  list.innerHTML = days.map(dayCard).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.day-head'), function (el) {
    el.addEventListener('click', function () { el.parentElement.classList.toggle('open'); });
  });

  function dayCard(day) {
    var ds = StatsLib.computeDayStats(day);
    var badge = ds.pending > 0
      ? '<span class="badge pending">🍯 待回填 ' + ds.pending + ' 场</span>'
      : '<span class="badge good">⚽ 方向 ' + ds.direction.score + '/' + ds.direction.total + '</span>';
    var tiers = (Array.isArray(day.plan) && day.plan.length > 0)
      ? '<div class="mini-tiers">' + day.plan.map(function (t, i) {
          return '<a class="mini-tier-link" href="#tier-' + esc(day.date) + '-' + i + '">' +
            '<div class="mini-tier" style="border-left-color:' + TIER_COLORS[i % TIER_COLORS.length] + '">' +
            '<b>' + ((t.market || 'jc') === 'std' ? '📊 ' : '🇨🇳 ') + esc(t.name) + ' ' + esc(t.pct) + '</b><br>' + esc(t.text) + '</div></a>';
        }).join('') + '</div>'
      : '';
    return '<div class="day-card" id="day-' + esc(day.date) + '">' +
      '<div class="day-head"><div><div class="day-title">' + esc(day.date) + '</div>' +
      '<div class="day-meta">' + esc(day.dayPillar || '') + (day.dayNote ? ' · ' + esc(day.dayNote) : '') + ' · ' + ds.matches + ' 场</div></div>' +
      badge + '</div>' +
      '<div class="day-body">' + matchTable(day) + tiers +
      (day.analysis ? '<a class="analysis-link" href="#analysis-' + esc(day.date) + '"><span>📋 ' + esc(day.date.slice(5).replace('-', '')) + ' 完整分析</span><span class="al-sub">↗</span></a>' : '') +
      (day.planNote ? '<div class="plan-note">⚠️ ' + esc(day.planNote) + '</div>' : '') +
      (day.review ? '<div class="review"><b>🔍 复盘结论：</b>' + esc(day.review) + '</div>' : '') +
      '</div></div>';
  }

  function mark(v) {
    if (v === null) return '<span class="wait">—</span>';
    if (v === 1) return '<span class="hit">✅</span>';
    if (v === 0.5) return '<span class="half">半✅</span>';
    return '<span class="miss">❌</span>';
  }

  function matchTable(day) {
    var rows = day.matches.map(function (m) {
      var pending = !m.finalScore;
      var judge = pending ? '<span class="wait">—</span>'
        : mark(StatsLib.judgeDirection(m.direction, m.finalScore)) + ' ' +
          mark(StatsLib.judgeOverUnder(m.overUnder, m.finalScore)) + ' ' +
          mark(StatsLib.judgeScore(m.score, m.finalScore));
      return '<tr><td>' + esc(m.id) + '</td><td>' + esc(m.league) + ' ' + esc(m.time) + '</td>' +
        '<td>' + esc(m.home) + ' vs ' + esc(m.away) + '</td>' +
        '<td>' + esc(m.direction) + ' / ' + esc(m.overUnder) + ' / ' + esc((m.score || []).join(' ')) +
        ' <span class="stars">' + '★'.repeat(m.confidence || 0) + '</span></td>' +
        '<td>' + (pending ? '<span class="wait">待回填</span>' : esc(m.finalScore)) + '</td>' +
        '<td>' + judge + '</td></tr>';
    }).join('');
    return '<table><tr><th>编号</th><th>联赛/时间</th><th>对阵</th><th>预测（方向/大小/比分）</th><th>赛果</th><th>判定（方向/大小/比分）</th></tr>' + rows + '</table>';
  }
})();
</script>
</body>
</html>
